name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: ตรวจว่าบันเดิลรองรับเบราว์เซอร์เก่า (nomodule)
        run: |
          if ! grep -q "nomodule" dist/index.html; then
            echo "::error::ไม่พบ <script nomodule> — ชุด legacy หายไป ทำให้เว็บขาวใน in-app browser"
            exit 1
          fi
      - name: ตรวจว่ามีไฟล์โลโก้ครบ
        run: |
          for f in mobyconnex-horizontal.png mobyconnex-horizontal-dark.png mobyconnex-footer.png mobyconnex-mark.png; do
            test -s "public/brand/$f" || { echo "::error::ไม่พบ public/brand/$f"; exit 1; }
          done
